name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-14
    env:
      CLOUDEAI_TARGET_ARCH: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified llama.cpp runtime
        run: npm run prepare:sidecar -w @cloudeai/desktop

      - name: Check TypeScript
        run: npm run check

      - name: Run JavaScript tests
        run: npm test

      - name: Run Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build Apple Silicon application
        run: npm exec -w @cloudeai/desktop -- tauri build --target aarch64-apple-darwin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudEAI-macOS-arm64
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/CloudEAI.app
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Attach DMG to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
