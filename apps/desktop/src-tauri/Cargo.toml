[package]
name = "cloudeai-desktop"
version = "0.1.0"
description = "Private local-first AI assistant for macOS"
authors = ["CloudEAI"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cloudeai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3.34"
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
uuid = { version = "1.24.1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "time", "process", "sync"] }
aes-gcm = "0.11.0"

